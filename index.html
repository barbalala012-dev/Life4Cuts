<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fff7ef">
<title>우리 반 네컷 포토부스</title>
<style>
:root{color-scheme:light;--ink:#292345;--pink:#f45f93;--lilac:#f1eafa;--line:#e7dced}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff7ef,#f2edff);color:var(--ink);font-family:system-ui,"Apple SD Gothic Neo",sans-serif}header{text-align:center;padding:24px 14px 10px}h1{font-size:clamp(25px,5vw,39px);margin:0}header p{margin:8px 0;color:#70667c}.layout{max-width:1120px;margin:auto;padding:12px 16px 36px;display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.card{background:#ffffffed;border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 8px 25px #30234712}.card h2{font-size:19px;margin:0 0 12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,.pick{border:0;border-radius:11px;padding:10px 13px;background:var(--ink);color:white;font-weight:700;cursor:pointer;font:inherit;font-weight:700}button.primary{background:var(--pink)}button.soft,.pick{background:var(--lilac);color:var(--ink)}button:disabled{opacity:.45;cursor:not-allowed}.stage{position:relative;background:#211d2a;border-radius:14px;overflow:hidden;aspect-ratio:4/3;margin:12px 0}.stage video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.stage .placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#fff9;font-size:14px;pointer-events:none}.counter,.muted{font-size:13px;color:#746b81}.result{display:block;width:auto;max-width:100%;max-height:64vh;margin:14px auto;background:#faf7fb;border-radius:12px}.result[hidden]{display:none}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:9px;max-height:390px;overflow:auto}.tile{padding:6px;border:2px solid transparent;border-radius:12px;background:#faf7fc;color:var(--ink);text-align:center;min-width:0}.tile.active{border-color:var(--pink)}.tile img{display:block;width:100%;height:112px;object-fit:contain;background:#f0edf3;border-radius:8px}.tile span{display:block;margin-top:5px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hint{font-size:13px;line-height:1.55;color:#716780}.file{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.file:focus+.pick{outline:3px solid #c19de3}.notice{min-height:20px;color:#a14370;font-size:13px;margin:8px 0 0}.section{margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}.badge{display:inline-block;border-radius:99px;padding:3px 7px;background:#eee8f5;font-size:10px;color:#655978;margin-left:3px}@media(max-width:760px){.layout{grid-template-columns:1fr}.result{max-height:58vh}}
</style></head>
<body><header><h1>우리 반 네컷 포토부스 ✨</h1><p>프레임을 고르고 네 장을 찍어 나만의 사진을 만들어요.</p></header>
<div class="layout"><main class="card"><h2>📸 네컷 촬영</h2><div class="row"><button id="start" class="primary">카메라 켜기</button><button id="reset" class="soft">다시 찍기</button><span id="counter" class="counter">사진 0 / 4</span></div><div class="stage"><video id="video" autoplay playsinline muted></video><div id="placeholder" class="placeholder">카메라를 켜면 미리보기가 보여요</div></div><div class="row"><button id="snap" disabled>사진 찍기</button><button id="finish" class="soft" disabled>네컷 완성</button><button id="save" class="primary" disabled>사진 다운로드</button></div><canvas id="canvas" class="result" width="720" height="1440" hidden></canvas><p class="hint">사진은 이 기기 안에서만 처리하고 저장해요. 서버로 전송하지 않습니다.</p></main>
<aside><section class="card"><h2>🎨 프레임 선택</h2><div id="gallery" class="gallery" aria-label="프레임 목록"></div><p class="hint">선택한 프레임: <b id="selectedName">기본 프레임</b></p><div class="section"><h2>🖍️ 학생 프레임 추가</h2><div class="row"><input id="upload" class="file" type="file" accept="image/png"><label for="upload" class="pick">투명 PNG 추가</label><button id="downloadFrame" class="soft">선택 PNG 다운로드</button></div><p class="hint">추가한 프레임은 현재 브라우저에 보관됩니다. 반 공용 프레임으로 누적하려면 교사가 작품을 검토해 GitHub 저장소의 <code>frames</code> 폴더에 등록하면 모든 학생에게 표시됩니다.</p><div class="row"><button id="backup" class="soft">내 프레임 백업</button><input id="restore" class="file" type="file" accept="application/json"><label for="restore" class="pick">백업 불러오기</label></div><p id="notice" class="notice" role="status"></p></div></section></aside></div>
<script>
'use strict';
const STORE='class-photobooth-local-frames-v2', manifestUrl=new URL('./frames/manifest.json',location.href);
const video=document.querySelector('#video'), canvas=document.querySelector('#canvas'), ctx=canvas.getContext('2d'), notice=document.querySelector('#notice');
let camera=null,shots=[],localFrames=readLocal(),sharedFrames=[],selected='builtin';
function readLocal(){try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch{return []}}
function say(text){notice.textContent=text}
function builtinSvg(){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1440"><rect width="720" height="1440" fill="none" stroke="#f45f93" stroke-width="30"/><rect x="16" y="16" width="688" height="1408" rx="28" fill="none" stroke="#ffd166" stroke-width="8"/><text x="360" y="82" text-anchor="middle" font-size="34" font-family="sans-serif" fill="#674a81">OUR FOUR CUTS ✦</text><text x="360" y="1398" text-anchor="middle" font-size="25" font-family="sans-serif" fill="#674a81">MEMORIES · 2026</text><g fill="#f45f93" font-size="38"><text x="34" y="77">✦</text><text x="648" y="77">♥</text><text x="34" y="1400">♥</text><text x="648" y="1400">✦</text></g></svg>`)}
function allFrames(){return [{id:'builtin',name:'별빛 네컷',src:builtinSvg(),kind:'builtin'},...sharedFrames.map(f=>({...f,kind:'shared'})),...localFrames.map(f=>({...f,kind:'local'}))]}
function currentFrame(){return allFrames().find(f=>f.id===selected)||allFrames()[0]}
function renderGallery(){const g=document.querySelector('#gallery');g.replaceChildren();for(const f of allFrames()){const b=document.createElement('button');b.type='button';b.className='tile'+(selected===f.id?' active':'');b.setAttribute('aria-pressed',selected===f.id?'true':'false');const img=document.createElement('img');img.src=f.src;img.alt='';const label=document.createElement('span');label.textContent=f.name;const badge=document.createElement('small');badge.className='badge';badge.textContent=f.kind==='shared'?'반 공용':f.kind==='local'?'내 기기':'기본';label.append(' ',badge);b.append(img,label);b.onclick=()=>{selected=f.id;document.querySelector('#selectedName').textContent=f.name;renderGallery()};g.append(b)}}
function update(){document.querySelector('#counter').textContent=`사진 ${shots.length} / 4`;document.querySelector('#snap').disabled=!camera||shots.length>=4;document.querySelector('#finish').disabled=shots.length!==4;document.querySelector('#placeholder').hidden=!!camera}
async function loadShared(){try{const r=await fetch(manifestUrl,{cache:'no-store'});if(!r.ok)throw Error('manifest');const data=await r.json();sharedFrames=await Promise.all((data.frames||[]).map(async(f,i)=>({id:'shared-'+i+'-'+f.file,name:f.name||f.file,src:new URL(f.file,new URL('./frames/',location.href)).href})));renderGallery()}catch{say('공용 프레임 목록을 불러오지 못했어요. 기본 프레임은 사용할 수 있습니다.')}}
document.querySelector('#start').onclick=async()=>{try{camera=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=camera;await video.play();update();say('촬영 준비가 되었어요.')}catch{say('카메라를 열 수 없어요. 사이트의 카메라 권한과 HTTPS 연결을 확인해 주세요.')}};
document.querySelector('#snap').onclick=()=>{if(!video.videoWidth)return;const c=document.createElement('canvas');c.width=640;c.height=480;const x=c.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(video,0,0,c.width,c.height);shots.push(c);update();say(shots.length<4?`${shots.length}장을 찍었어요. 계속 촬영해 주세요.`:'네 장을 다 찍었어요. 네컷 완성을 눌러 주세요.')};
document.querySelector('#reset').onclick=()=>{shots=[];canvas.hidden=true;document.querySelector('#save').disabled=true;update();say('촬영을 다시 시작할 수 있어요.')};
document.querySelector('#finish').onclick=async()=>{ctx.clearRect(0,0,720,1440);ctx.fillStyle='#fff9f2';ctx.fillRect(0,0,720,1440);const left=48,top=120,w=624,h=300,gap=18;for(let i=0;i<4;i++){const y=top+i*(h+gap);ctx.save();ctx.beginPath();ctx.roundRect(left,y,w,h,10);ctx.clip();ctx.drawImage(shots[i],left,y,w,h);ctx.restore()}const f=currentFrame();try{const im=new Image();im.src=f.src;await im.decode();ctx.drawImage(im,0,0,720,1440);canvas.hidden=false;document.querySelector('#save').disabled=false;say('완성했어요. 사진 다운로드를 눌러 저장하세요.')}catch{say('선택한 프레임을 불러오지 못했어요. 다른 프레임을 골라 주세요.')}};
document.querySelector('#save').onclick=()=>{canvas.toBlob(blob=>{if(!blob){say('사진을 만들지 못했어요.');return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='우리반-네컷.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png')};
document.querySelector('#upload').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;if(file.size>5*1024*1024){say('프레임은 5MB 이하 PNG로 준비해 주세요.');e.target.value='';return}try{const src=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});const im=new Image();im.src=src;await im.decode();const name=file.name.replace(/\.png$/i,'');const f={id:'local-'+crypto.randomUUID(),name,src};localFrames.push(f);localStorage.setItem(STORE,JSON.stringify(localFrames));selected=f.id;document.querySelector('#selectedName').textContent=name;renderGallery();say('프레임을 이 브라우저에 저장했어요. 반 공용 등록은 백업 파일을 교사에게 전달해 주세요.')}catch{say('저장 공간이 부족하거나 올바르지 않은 PNG예요.')}e.target.value=''};
document.querySelector('#downloadFrame').onclick=()=>{const f=currentFrame();if(f.kind==='builtin'){say('기본 프레임은 앱에 포함되어 있어요.');return}const a=document.createElement('a');a.href=f.src;a.download=f.name+'.png';a.click()};
document.querySelector('#backup').onclick=()=>{const blob=new Blob([JSON.stringify(localFrames)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='우리반-프레임-백업.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
document.querySelector('#restore').onchange=async e=>{try{const imported=JSON.parse(await e.target.files[0].text());if(!Array.isArray(imported)||imported.some(f=>!f.name||!f.src?.startsWith('data:image/png')))throw Error('invalid');localFrames=[...localFrames,...imported.map(f=>({...f,id:'local-'+crypto.randomUUID()}))];localStorage.setItem(STORE,JSON.stringify(localFrames));renderGallery();say('프레임을 불러왔어요.')}catch{say('백업 파일을 읽지 못했어요.')}e.target.value=''};
renderGallery();update();loadShared();
</script></body></html>
